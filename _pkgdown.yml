url: https://belian-earth.github.io/shoal/
development:
  mode: auto
template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: '#74ac90ff'
  math-rendering: mathjax
navbar:
  structure:
    left:
    - reference
    - intro
    - articles
    - news
    right:
    - search
    - github
  components:
    github:
      icon: fa-github
      href: https://github.com/belian-earth/shoal
reference:
- title: Clustering
  desc: Clustering algorithms.
  contents:
  - shoal_kmeans
  - shoal_gmm
  - shoal_dbscan
  - shoal_hdbscan
  - shoal_evoc
  - shoal_hclust
  - shoal_slic
- title: Distances
  desc: Pairwise distance matrices and nearest-neighbour search.
  contents:
  - shoal_dist
  - shoal_knn
- title: Validation
  desc: Assessing a clustering, and choosing the number of clusters.
  contents:
  - shoal_silhouette
  - shoal_metrics
- title: Methods
  desc: Shared print and plot methods, and prediction for centroid models.
  contents:
  - plot.shoal
  - shoal_palette
  - print.shoal
  - predict.shoal_kmeans
  - predict.shoal_gmm
  - logLik.shoal_gmm
- title: Configuration
  desc: Runtime settings.
  contents: shoal_threads
- title: Data
  desc: Bundled datasets.
  contents:
